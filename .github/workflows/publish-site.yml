name: Publish static site

# Called by web-deploy.yml and notes-deploy.yml after they upload a build
# artifact named "<site>-site". Cloudflare Pages serves the result; nothing
# runs on the homelab.
on:
  workflow_call:
    inputs:
      site:
        description: "Build artifact prefix (web or notes)"
        required: true
        type: string
      project:
        description: "Cloudflare Pages project name"
        required: true
        type: string
      host:
        description: "Hostname the site is served on"
        required: true
        type: string
    secrets:
      CLOUDFLARE_PAGES_TOKEN:
        description: "Cloudflare API token with Account > Cloudflare Pages > Edit"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ inputs.host }}/
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.site }}-site
          path: ${{ runner.temp }}/site-build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ runner.temp }}/site-build
            --project-name=${{ inputs.project }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=true

      - name: Verify the site responds
        env:
          SITE_HOST: ${{ inputs.host }}
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "https://${SITE_HOST}/"
