name: Run Tests

on:
  pull_request:
    branches: ["main"]

  schedule:
    # Run daily at 8:00 AM UTC
    - cron: "0 8 * * *"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Run tests
        working-directory: tests
        run: npm test
