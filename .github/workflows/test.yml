name: Run Tests

on:
  pull_request:
    branches: ["main"]
    # Notes PRs are validated by notes-deploy.yml.
    paths-ignore:
      - "notes/**"

  schedule:
    # Run daily at 8:00 AM UTC
    - cron: "0 8 * * *"

  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  test:
    # Exercises the live api.elimelt.com, which is offline while the sites are
    # static. Set the LIVE_API repository variable to true to run it again.
    if: vars.LIVE_API == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Run tests
        working-directory: tests
        run: npm test
