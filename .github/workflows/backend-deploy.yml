name: Backend CI and Deploy

# The homelab API is offline and the sites are served from Cloudflare Pages.
# Push and pull request triggers are off so nothing redeploys it; run this by
# hand once the homelab is back.
on:
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            infra/api/requirements.txt
            infra/api/requirements.embeddings.txt
            infra/api/requirements.dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt -r api/requirements.dev.txt

      - name: Test
        run: python -m pytest

  deploy:
    name: Deploy backend
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, blink]
    environment: backend
    env:
      DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH || '/home/elimelt/repos/web-deploy' }}
      HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL || 'https://api.elimelt.com/health' }}
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Validate deploy checkout
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_PATH}" ]; then
            echo "Set the BACKEND_DEPLOY_PATH repository or environment variable."
            exit 1
          fi

          if [ ! -d "${DEPLOY_PATH}/.git" ]; then
            echo "BACKEND_DEPLOY_PATH must point at a git checkout: ${DEPLOY_PATH}"
            exit 1
          fi

          if [ ! -f "${DEPLOY_PATH}/infra/.env" ]; then
            echo "Missing ${DEPLOY_PATH}/infra/.env; deploy uses the host's existing Compose env file."
            exit 1
          fi

          if [ -n "$(git -C "${DEPLOY_PATH}" status --porcelain)" ]; then
            echo "Deploy checkout is dirty. Commit/stash local changes or use a dedicated clean deploy clone."
            git -C "${DEPLOY_PATH}" status --short
            exit 1
          fi

      - name: Update checkout
        run: |
          set -euo pipefail
          git -C "${DEPLOY_PATH}" fetch origin main
          git -C "${DEPLOY_PATH}" checkout main
          git -C "${DEPLOY_PATH}" reset --hard "${GITHUB_SHA}"

      - name: Build, smoke test, deploy, and roll back on failure
        run: |
          set -euo pipefail
          # Create the static sites mount as the runner user; Docker would create it root-owned.
          mkdir -p "${SITES_PATH:-/home/elimelt/sites}"
          # Optional Codex auth directory (see infra/README.md); keep it runner-owned if absent.
          codex_dir="${CODEX_AUTH_DIR:-/home/elimelt/.codex-api}"
          mkdir -p "$codex_dir"
          # Refresh the API's copy of the Codex login so a re-login on the host takes effect on deploy.
          if [ -f "$HOME/.codex/auth.json" ]; then
            install -m 600 "$HOME/.codex/auth.json" "$codex_dir/auth.json"
          fi
          "${DEPLOY_PATH}/infra/scripts/deploy-backend.sh"
