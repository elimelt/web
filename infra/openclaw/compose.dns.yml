# Enable after grep-private has enrolled and its stable IP is known.
# Pass --env-file .env.private as well as --env-file ../.env.
services:
  dns:
    image: coredns/coredns:1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1
    restart: unless-stopped
    network_mode: host
    command: -conf /etc/coredns/Corefile
    environment:
      PRIVATE_PROXY_IP: ${PRIVATE_PROXY_IP:?Set the enrolled grep-private node IPv4 address}
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
