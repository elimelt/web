# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Elijah's Notes
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: notes.elimelt.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    # Quartz downloads and rewrites Google Fonts during the build when caching
    # is disabled, so visitors load the font files from this site.
    cdnCaching: false
    typography:
      # Headings use 600, so request it instead of Quartz's default 700.
      header:
        name: IBM Plex Sans
        weights: [400, 600]
      body: IBM Plex Sans
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e4e4e1"
        gray: "#6f6f6b"
        darkgray: "#33332f"
        dark: "#141413"
        secondary: "#1f5fbf"
        tertiary: "#0f3f86"
        highlight: rgba(31, 95, 191, 0.08)
        textHighlight: "#fff1a3"
      darkMode:
        light: "#121212"
        lightgray: "#2b2b2b"
        gray: "#9a9a9a"
        darkgray: "#d6d6d6"
        dark: "#f3f3f3"
        secondary: "#8ab4ff"
        tertiary: "#b9d1ff"
        highlight: rgba(138, 180, 255, 0.1)
        textHighlight: "#6b5a1f"
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:vazome/quartz-jupyter-embed
    enabled: true
    options:
      cacheDir: .quartz-cache/notebooks
      downloadFromGitHub: false
      downloadTimeout: 15000
    order: 15
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
      katexOptions:
        output: htmlAndMathml
    order: 80
  - source: ../quartz-site/math-tex-source
    enabled: true
    order: 85
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      includeEmptyFiles: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        depth: 1
        showTags: false
        focusOnHover: true
      globalGraph:
        showTags: false
        scale: 0.8
        repelForce: 0.75
        centerForce: 0.12
        linkDistance: 48
        fontSize: 0.55
        enableRadial: false
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: ../quartz-site/plugins/copy-markdown
    enabled: true
    options:
      outputDir: static/markdown
      sourceDir: ../content
    order: 850
    layout:
      position: footer
      priority: 4
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/elimelt/web/tree/main/notes
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # Calls transcribe.elimelt.com and llm.elimelt.com on the homelab, which are
  # offline while the notes are served as plain static files.
  - source: ../quartz-site/tts-reader
    enabled: false
    layout:
      position: footer
      priority: 5
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
